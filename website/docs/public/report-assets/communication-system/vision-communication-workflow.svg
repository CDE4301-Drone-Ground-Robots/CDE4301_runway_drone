<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="title desc">
<title id="title">Vision to HUNTER: FOD delivery and separate link checks</title>
<desc id="desc">Vision uses navigation data to calculate FOD coordinates. ARGUS stores the coordinates, sends one target, and waits for HUNTER to confirm receipt before sending the next. A separate handshake checks the link every second. No response for 10 seconds triggers a base-station notification if reachable. Missing target ACKs with an active link allow 50 resends before a separate delivery error. After either error, retain targets. ARGUS is proposed to descend and land at a clear location before waiting for base instructions. Landing behaviour will be tested after interim. Unacknowledged coordinates remain stored for resending after reconnection. Live integration will be implemented and tested after interim.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d7aa94"/></marker>
<marker id="ack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a8d4bc"/></marker>
<style>text{font-family:Arial,sans-serif;fill:#eef1f6;text-anchor:middle}.title{font-size:28px;font-weight:600}.heading{font-size:22px;font-weight:600}.body{font-size:20px}.note{font-size:18px;fill:#bec7d1}.box{fill:#1b2b39;stroke:#708b9e;stroke-width:1.5}.flow{fill:none;stroke:#d7aa94;stroke-width:2;marker-end:url(#arrow)}.return{fill:none;stroke:#a8d4bc;stroke-width:2;stroke-dasharray:8 6;marker-end:url(#ack)}</style>
</defs>
<rect width="1200" height="900" rx="18" fill="#0d131d"/>
<text class="title" x="600" y="45">Vision-to-Comms Workflow</text>
<text class="note" x="600" y="81">Stage 2 demonstrates the queue. Live integration will be done after interim.</text>
<text class="heading" x="415" y="125" fill="#e5c1ae">FOD delivery</text>
<rect class="box" x="90" y="150" width="650" height="90" rx="12"/>
<text class="heading" x="415" y="183">1. Vision calculates the FOD coordinates</text>
<text class="body" x="415" y="215">Uses the detected object and navigation data</text>
<path class="flow" d="M415 240V275"/>
<rect class="box" x="90" y="280" width="650" height="90" rx="12"/>
<text class="heading" x="415" y="313">2. ARGUS stores the coordinates in its queue</text>
<text class="body" x="415" y="345">Keep each target until HUNTER confirms receipt</text>
<path class="flow" d="M415 370V405"/>
<rect class="box" x="90" y="410" width="650" height="90" rx="12"/>
<text class="heading" x="415" y="443">3. ARGUS sends one FOD target</text>
<text class="body" x="415" y="475">Send its coordinates and target ID over ROS 2</text>
<path class="flow" d="M415 500V535"/>
<rect class="box" x="90" y="540" width="650" height="90" rx="12"/>
<text class="heading" x="415" y="573">4. HUNTER receives and stores the target</text>
<text class="body" x="415" y="605">Check the target ID to avoid duplicates</text>
<path class="flow" d="M415 630V665"/>
<rect x="90" y="670" width="650" height="120" rx="12" fill="#1d3b35" stroke="#708b9e" stroke-width="1.5"/>
<text class="heading" x="415" y="705">5. HUNTER returns a receipt ACK</text>
<text class="body" x="415" y="739">ARGUS checks that the target ID matches</text>
<text class="body" x="415" y="769">Then sends the next queued target</text>
<path class="return" d="M90 730H40V325H85"/>
<path d="M785 140V800" stroke="#40596b" stroke-dasharray="5 8"/>
<text class="heading" x="995" y="125" fill="#e5c1ae">Link and delivery checks</text>
<rect x="830" y="150" width="330" height="640" rx="14" fill="#12202b" stroke="#40596b"/>
<text class="heading" x="995" y="193">Check the link every second</text>
<text class="body" x="995" y="230">ARGUS sends a link check</text>
<text class="body" x="995" y="260">HUNTER replies</text>
<text class="heading" x="995" y="313">No reply for 10 seconds?</text>
<text class="body" x="995" y="348">Report link loss to base</text>
<path d="M855 383H1135" stroke="#40596b"/>
<text class="heading" x="995" y="424">Link active, no FOD ACK?</text>
<text class="body" x="995" y="459">Resend the same target</text>
<text class="body" x="995" y="489">up to 50 times</text>
<text class="body" x="995" y="527">Still no ACK? Report an error</text>
<path d="M855 560H1135" stroke="#40596b"/>
<text class="heading" x="995" y="598">After either error</text>
<text class="body" x="995" y="634">ARGUS lands at a clear site</text>
<text class="body" x="995" y="664">Then waits for base instructions</text>
<text class="note" x="995" y="710">Keep undelivered targets.</text>
<text class="note" x="995" y="740">Landing tests after interim.</text>
<text class="note" x="600" y="850">Receipt ACK confirms delivery. HUNTER handles navigation and collection separately.</text>
</svg>
