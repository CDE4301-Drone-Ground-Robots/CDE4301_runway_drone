<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
<title id="title">ARGUS-HUNTER communication with an ARGUS sender queue</title>
<desc id="desc">The ARGUS queue stores FOD coordinates in arrival order. A matching receipt acknowledgement releases the next alert. Unacknowledged alerts remain stored for retry. The queue is demonstrated in Stage 2, while live acknowledgements and retries are planned.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#d6b19c"/></marker><marker id="ack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#91c7ac"/></marker></defs>
<rect width="1200" height="680" rx="18" fill="#0d131d"/>
<text x="600" y="38" text-anchor="middle" dominant-baseline="middle" fill="#f1f4f7" font-family="Arial,sans-serif" font-size="29" font-weight="600">ARGUS-HUNTER Communication</text>
<text x="600" y="72" text-anchor="middle" dominant-baseline="middle" fill="#c2cad3" font-family="Arial,sans-serif" font-size="19" font-weight="400">ARGUS queue demonstrated in Stage 2. Live receipt ACK and retry are planned.</text>
<rect x="30" y="112" width="410" height="405" rx="16" fill="#13202d" stroke="#526d81"/>
<rect x="760" y="112" width="410" height="405" rx="16" fill="#13202d" stroke="#526d81"/>
<text x="235" y="139" text-anchor="middle" dominant-baseline="middle" fill="#e5c1ae" font-family="Arial,sans-serif" font-size="23" font-weight="600">ARGUS</text>
<text x="965" y="139" text-anchor="middle" dominant-baseline="middle" fill="#e5c1ae" font-family="Arial,sans-serif" font-size="23" font-weight="600">HUNTER</text>
<rect x="55" y="169" width="360" height="72" rx="12" fill="#20374a" stroke="#8fabbc" stroke-width="2"/>
<text x="235.0" y="190.5" text-anchor="middle" dominant-baseline="middle" fill="#f1f4f7" font-family="Arial,sans-serif" font-size="23" font-weight="600">Vision coordinate extraction</text>
<text x="235.0" y="219.5" text-anchor="middle" dominant-baseline="middle" fill="#f1f4f7" font-family="Arial,sans-serif" font-size="21" font-weight="400">New FOD target</text>
<rect x="55" y="282" width="360" height="110" rx="12" fill="#1d3b35" stroke="#8fabbc" stroke-width="2"/>
<text x="235.0" y="308.0" text-anchor="middle" dominant-baseline="middle" fill="#f1f4f7" font-family="Arial,sans-serif" font-size="22" font-weight="600">ARGUS sender queue</text>
<text x="235.0" y="337.0" text-anchor="middle" dominant-baseline="middle" fill="#f1f4f7" font-family="Arial,sans-serif" font-size="20" font-weight="400">Store coordinates in arrival order</text>
<text x="235.0" y="366.0" text-anchor="middle" dominant-baseline="middle" fill="#f1f4f7" font-family="Arial,sans-serif" font-size="20" font-weight="400">Keep alert until receipt ACK</text>
<rect x="55" y="438" width="360" height="58" rx="12" fill="#20374a" stroke="#8fabbc" stroke-width="2"/>
<text x="235.0" y="467.0" text-anchor="middle" dominant-baseline="middle" fill="#f1f4f7" font-family="Arial,sans-serif" font-size="22" font-weight="600">Publish oldest queued alert</text>
<rect x="490" y="429" width="220" height="76" rx="12" fill="#3b2c49" stroke="#8fabbc" stroke-width="2"/>
<text x="600.0" y="452.5" text-anchor="middle" dominant-baseline="middle" fill="#f1f4f7" font-family="Arial,sans-serif" font-size="22" font-weight="600">ROS 2 / DDS</text>
<text x="600.0" y="481.5" text-anchor="middle" dominant-baseline="middle" fill="#f1f4f7" font-family="Arial,sans-serif" font-size="20" font-weight="400">Wi-Fi (interim)</text>
<rect x="785" y="438" width="360" height="58" rx="12" fill="#20374a" stroke="#8fabbc" stroke-width="2"/>
<text x="965.0" y="467.0" text-anchor="middle" dominant-baseline="middle" fill="#f1f4f7" font-family="Arial,sans-serif" font-size="22" font-weight="600">Receive the FOD alert</text>
<rect x="785" y="282" width="360" height="110" rx="12" fill="#1d3b35" stroke="#8fabbc" stroke-width="2"/>
<text x="965.0" y="308.0" text-anchor="middle" dominant-baseline="middle" fill="#f1f4f7" font-family="Arial,sans-serif" font-size="22" font-weight="600">Store each target once</text>
<text x="965.0" y="337.0" text-anchor="middle" dominant-baseline="middle" fill="#f1f4f7" font-family="Arial,sans-serif" font-size="20" font-weight="400">Return receipt ACK</text>
<text x="965.0" y="366.0" text-anchor="middle" dominant-baseline="middle" fill="#f1f4f7" font-family="Arial,sans-serif" font-size="20" font-weight="400">Use the same threat ID</text>
<rect x="785" y="169" width="360" height="72" rx="12" fill="#20374a" stroke="#8fabbc" stroke-width="2"/>
<text x="965.0" y="190.5" text-anchor="middle" dominant-baseline="middle" fill="#f1f4f7" font-family="Arial,sans-serif" font-size="23" font-weight="600">Target navigation</text>
<text x="965.0" y="219.5" text-anchor="middle" dominant-baseline="middle" fill="#f1f4f7" font-family="Arial,sans-serif" font-size="21" font-weight="400">PoseStamped goal</text>
<polyline points="235,241 235,282" fill="none" stroke="#d6b19c" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="235,392 235,438" fill="none" stroke="#d6b19c" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="415,467 490,467" fill="none" stroke="#d6b19c" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="710,467 785,467" fill="none" stroke="#d6b19c" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="965,438 965,392" fill="none" stroke="#d6b19c" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="965,282 965,241" fill="none" stroke="#d6b19c" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="785,337 415,337" fill="none" stroke="#91c7ac" stroke-width="3" stroke-linejoin="round" stroke-dasharray="9 6" marker-end="url(#ack)"/>
<text x="600" y="298" text-anchor="middle" dominant-baseline="middle" fill="#a8d4bc" font-family="Arial,sans-serif" font-size="21" font-weight="600">Receipt ACK</text>
<text x="600" y="369" text-anchor="middle" dominant-baseline="middle" fill="#a8d4bc" font-family="Arial,sans-serif" font-size="19" font-weight="400">Send next after ACK</text>
<rect x="55" y="548" width="1090" height="90" rx="12" fill="#3b2c49" stroke="#8fabbc" stroke-width="2"/>
<text x="600.0" y="578.5" text-anchor="middle" dominant-baseline="middle" fill="#f1f4f7" font-family="Arial,sans-serif" font-size="22" font-weight="600">No receipt ACK or link lost: keep the alert in the ARGUS queue.</text>
<text x="600.0" y="607.5" text-anchor="middle" dominant-baseline="middle" fill="#f1f4f7" font-family="Arial,sans-serif" font-size="20" font-weight="400">Retry up to 100 times, then notify the base station if reachable. Keep undelivered alerts.</text>
<text x="600" y="660" text-anchor="middle" dominant-baseline="middle" fill="#c2cad3" font-family="Arial,sans-serif" font-size="19" font-weight="400">Receipt ACK confirms delivery, not completed FOD collection.</text>
</svg>
