<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-labelledby="title desc">
<title id="title">ARGUS to HUNTER communication</title>
<desc id="desc">Vision sends detected FOD coordinates to the ARGUS queue. ARGUS sends one stored target to HUNTER over ROS 2 and Wi-Fi. HUNTER stores the target without duplicates and returns a receipt acknowledgement. ARGUS then sends the next target. Alerts without an acknowledgement remain stored for retry. Live acknowledgements, retries and target navigation integration are proposed.</desc>
<defs>
<marker id="send" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#d7aa94"/></marker>
<marker id="ack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a8d4bc"/></marker>
<style>text{font-family:Arial,sans-serif;fill:#eef1f6;text-anchor:middle} .title{font-size:28px;font-weight:600}.heading{font-size:22px;font-weight:600;fill:#e5c1ae}.label{font-size:20px;font-weight:600}.body{font-size:18px}.note{font-size:18px;fill:#bec7d1}.box{fill:#1b2b39;stroke:#708b9e;stroke-width:1.5}.flow{fill:none;stroke:#d7aa94;stroke-width:2;marker-end:url(#send)}.ack{fill:none;stroke:#a8d4bc;stroke-width:2;stroke-dasharray:8 6;marker-end:url(#ack)}</style>
</defs>
<rect width="1200" height="680" rx="18" fill="#0d131d"/>
<text class="title" x="600" y="49">ARGUS-HUNTER Communication</text>
<text class="note" x="600" y="87">Stage 2 demonstrates the ARGUS queue. Live ACK and retry are planned.</text>
<rect x="30" y="125" width="570" height="365" rx="16" fill="#12202b" stroke="#40596b"/>
<rect x="640" y="125" width="530" height="365" rx="16" fill="#12202b" stroke="#40596b"/>
<text class="heading" x="315" y="168">ARGUS</text>
<text class="heading" x="905" y="168">HUNTER</text>
<rect class="box" x="55" y="230" width="230" height="130" rx="12"/>
<text class="label" x="170" y="270">Vision system</text>
<text class="body" x="170" y="306">Extract FOD</text>
<text class="body" x="170" y="332">coordinates</text>
<rect class="box" x="320" y="230" width="255" height="130" rx="12"/>
<text class="label" x="447" y="270">Sender queue</text>
<text class="body" x="447" y="306">Store FOD coordinates</text>
<text class="body" x="447" y="332">Send one target at a time</text>
<rect class="box" x="665" y="230" width="225" height="130" rx="12"/>
<text class="label" x="777" y="270">Receive and store</text>
<text class="body" x="777" y="306">Check target ID</text>
<text class="body" x="777" y="332">Avoid duplicate targets</text>
<rect class="box" x="930" y="230" width="215" height="130" rx="12"/>
<text class="label" x="1037" y="270">Navigation</text>
<text class="body" x="1037" y="306">Use the received</text>
<text class="body" x="1037" y="332">FOD coordinates</text>
<path class="flow" d="M285 294H315"/>
<path class="flow" d="M575 294H660"/>
<path class="flow" d="M890 294H925"/>
<text class="note" x="620" y="203">ROS 2 / Wi-Fi</text>
<path class="ack" d="M777 360V425H447V365"/>
<rect x="475" y="398" width="275" height="53" rx="8" fill="#12202b"/>
<text x="612" y="418" font-size="18" fill="#a8d4bc">Receipt ACK returned</text>
<text x="612" y="443" font-size="17" fill="#a8d4bc">ARGUS sends the next target</text>
<rect x="55" y="525" width="1090" height="94" rx="12" fill="#20212f" stroke="#708b9e"/>
<text class="label" x="600" y="558">No ACK or connection lost: keep the target in the ARGUS queue.</text>
<text class="body" x="600" y="592">Retry up to 100 times, then notify the base station if reachable. Keep undelivered targets.</text>
<text class="note" x="600" y="653">ACK confirms receipt. It does not mean HUNTER has collected the FOD.</text>
</svg>
