<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="title desc">
<title id="title">ARGUS, HUNTER and base-station communication paths</title>
<desc id="desc">ARGUS sends FOD coordinates to HUNTER, which returns a receipt acknowledgement. Both vehicles send video and coordinates to the base station. The base sends control commands and link checks to both vehicles. ARGUS can still reach the base when HUNTER is disconnected only if its base connection remains available. After a communication error, ARGUS retains targets and is proposed to descend and land at a clear location before waiting for instructions. Full communication and landing behaviour will be tested after interim.</desc>
<defs>
<marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d7aa94"/></marker>
<marker id="control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a8d4bc"/></marker>
<style>text{font-family:Arial,sans-serif;fill:#eef1f6;text-anchor:middle}.title{font-size:28px;font-weight:600}.heading{font-size:23px;font-weight:600;fill:#e5c1ae}.body{font-size:20px}.note{font-size:18px;fill:#bec7d1}.box{fill:#1b2b39;stroke:#708b9e;stroke-width:1.5}.data{fill:none;stroke:#d7aa94;stroke-width:2;marker-end:url(#data)}.control{fill:none;stroke:#a8d4bc;stroke-width:2;stroke-dasharray:8 6;marker-end:url(#control)}</style>
</defs>
<rect width="1200" height="900" rx="18" fill="#0d131d"/>
<text class="title" x="600" y="46">ARGUS, HUNTER and Base Station</text>
<text class="note" x="600" y="83">Proposed final communication paths. Full integration will be done after interim.</text>
<rect class="box" x="350" y="130" width="500" height="140" rx="14"/>
<text class="heading" x="600" y="166">BASE STATION</text>
<text class="body" x="600" y="205">Receives video and coordinates</text>
<text class="note" x="600" y="238">Sends commands and checks both vehicle links</text>
<path class="data" d="M175 500V200H345"/>
<path class="data" d="M1025 500V200H855"/>
<rect x="65" y="314" width="220" height="80" rx="8" fill="#0d131d"/>
<text class="body" x="175" y="345">Video + coordinates</text>
<text class="note" x="175" y="376">Handshake replies</text>
<rect x="915" y="314" width="220" height="80" rx="8" fill="#0d131d"/>
<text class="body" x="1025" y="345">Video + coordinates</text>
<text class="note" x="1025" y="376">Handshake replies</text>
<path d="M600 270V380" fill="none" stroke="#a8d4bc" stroke-width="2" stroke-dasharray="8 6"/>
<path class="control" d="M600 380H370V495"/>
<path class="control" d="M600 380H830V495"/>
<rect x="470" y="295" width="260" height="62" rx="8" fill="#0d131d"/>
<text class="body" x="600" y="318">Control commands</text>
<text class="note" x="600" y="347">and link checks</text>
<rect class="box" x="70" y="500" width="420" height="160" rx="14"/>
<text class="heading" x="280" y="539">ARGUS</text>
<text class="body" x="280" y="578">FOD queue and database</text>
<text class="note" x="280" y="615">RGB and thermal video</text>
<rect class="box" x="710" y="500" width="420" height="160" rx="14"/>
<text class="heading" x="920" y="539">HUNTER</text>
<text class="body" x="920" y="578">Receives FOD targets</text>
<text class="note" x="920" y="615">Video and coordinates</text>
<path class="data" d="M490 555H705"/>
<text class="note" x="600" y="527">FOD coordinates</text>
<path class="control" d="M710 607H495"/>
<text class="note" x="600" y="638">Receipt ACK</text>
<rect x="55" y="710" width="1090" height="130" rx="12" fill="#20212f" stroke="#708b9e"/>
<text class="body" x="600" y="744">After a link or delivery error: keep targets stored and inform the base if reachable.</text>
<text class="body" x="600" y="780">ARGUS descends and lands at a clear location, then waits for further commands.</text>
<text class="note" x="600" y="815">Landing and communication procedures will be tested after the interim assessment.</text>
<text class="note" x="600" y="877">Base reachability depends on the remaining radio/network connection.</text>
</svg>
